<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#080807;--bg-el:#111110;--bg-ov:#1A1917;
  --br-sub:#1E1E1C;--br-def:#2A2A27;--br-str:#3A3A35;
  --tx-1:#E8E0D0;--tx-2:#9A9080;--tx-3:#5A5448;--tx-inv:#111110;
  --accent:#C8A96E;--accent-dim:rgba(200,169,110,0.13);--accent-h:#D8BA80;--accent-p:#A88848;
  --success:#7B9E87;--error:#C47070;--warning:#D4956A;
  --r-sm:6px;--r-md:10px;--r-lg:14px;--r-xl:20px;--r-full:9999px
}
body{background:var(--bg);font-family:'DM Sans','Noto Sans TC',sans-serif;min-height:100vh;display:flex;justify-content:center}
.phone{width:100%;max-width:430px;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;position:relative}

.hdr{position:sticky;top:0;z-index:60;background:rgba(8,8,7,0.96);backdrop-filter:blur(20px);border-bottom:1px solid var(--br-sub);padding:16px 20px 14px;display:flex;align-items:center;gap:12px}
.back-btn{width:44px;height:44px;border-radius:50%;background:var(--bg-ov);border:1px solid var(--br-def);color:var(--tx-2);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.back-btn:hover{border-color:var(--accent);color:var(--accent)}
.hdr-title{font-family:'Tenor Sans','Noto Sans TC',sans-serif;font-size:16px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx-1)}

.scroll{flex:1;overflow-y:auto;padding:20px 20px 60px}
.scroll::-webkit-scrollbar{display:none}

.section-label{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--tx-2);margin-bottom:12px}
.card{background:var(--bg-el);border:1px solid var(--br-def);border-radius:var(--r-lg);padding:18px;margin-bottom:16px}

/* Category management */
.cat-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--br-sub)}
.cat-row:last-child{border-bottom:none}
.cat-name{font-size:13px;color:var(--tx-1);font-weight:500}
.cat-type{font-size:10px;color:var(--tx-3);text-transform:capitalize}
.cat-row.inactive{opacity:0.4}
.cat-del{margin-left:auto;font-size:11px;color:var(--error);background:rgba(196,112,112,0.1);border:1px solid rgba(196,112,112,0.3);border-radius:var(--r-sm);padding:6px 10px;cursor:pointer;font-family:'DM Sans','Noto Sans TC',sans-serif}
.cat-del:hover{background:rgba(196,112,112,0.2)}
.cat-form{display:flex;gap:8px;margin-top:10px}
.cat-form input{flex:1;background:var(--bg);border:1px solid var(--br-def);border-radius:var(--r-md);padding:11px 12px;font-family:'DM Sans','Noto Sans TC',sans-serif;font-size:14px;color:var(--tx-1);outline:none}
.cat-form input:focus{border-color:var(--accent)}
.cat-form select{background:var(--bg);border:1px solid var(--br-def);border-radius:var(--r-md);padding:0 10px;font-family:'DM Sans','Noto Sans TC',sans-serif;font-size:13px;color:var(--tx-2)}
.cat-add-btn{background:var(--accent);border:none;border-radius:var(--r-md);padding:0 16px;color:var(--tx-inv);font-family:'DM Sans','Noto Sans TC',sans-serif;font-size:13px;font-weight:600;cursor:pointer}
.cat-add-btn:hover{background:var(--accent-h)}
.empty-hint{font-size:12px;color:var(--tx-3);padding:6px 0}

/* Student cards */
.student-card{background:var(--bg-el);border:1px solid var(--br-def);border-radius:var(--r-lg);margin-bottom:12px;overflow:hidden}
.student-hdr{display:flex;align-items:center;gap:12px;padding:16px;cursor:pointer;transition:background .15s}
.student-hdr:hover{background:var(--bg-ov)}
.student-avatar{width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;flex-shrink:0}
.student-name{font-size:14px;font-weight:500;color:var(--tx-1)}
.student-meta{font-size:11px;color:var(--tx-3);margin-top:2px}
.student-chevron{margin-left:auto;color:var(--tx-3);font-size:14px;transition:transform .2s}
.student-chevron.open{transform:rotate(90deg);color:var(--accent)}
.student-detail{display:none;padding:0 16px 16px;border-top:1px solid var(--br-sub)}
.student-detail.show{display:block}
.session-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--br-sub)}
.session-row:last-child{border-bottom:none}
.sr-name{font-size:13px;color:var(--tx-1);font-weight:500}
.sr-date{font-size:11px;color:var(--tx-3)}
.sr-dur{font-size:12px;color:var(--tx-2)}

/* Red flag badge */
.flag-badge{margin-left:8px;font-size:14px;flex-shrink:0;cursor:help}
.flag-badge.pain{filter:drop-shadow(0 0 4px rgba(196,112,112,0.5))}

/* Tabs */
.tabs{display:flex;gap:6px;padding:0 20px 14px;position:sticky;top:73px;background:var(--bg);z-index:50}
.tab-btn{flex:1;background:var(--bg-el);border:1px solid var(--br-def);border-radius:var(--r-md);padding:10px 6px;font-family:'DM Sans','Noto Sans TC',sans-serif;font-size:12px;font-weight:500;color:var(--tx-2);cursor:pointer;transition:all .15s}
.tab-btn.on{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
.tab-panel{display:none}
.tab-panel.on{display:block}

/* Groups */
.group-card{background:var(--bg-el);border:1px solid var(--br-def);border-radius:var(--r-lg);padding:16px;margin-bottom:14px}
.group-name{font-size:15px;font-weight:600;color:var(--tx-1)}
.group-desc{font-size:12px;color:var(--tx-3);margin-top:2px}
.group-meta{font-size:11px;color:var(--tx-2);margin-top:8px}
.group-members{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.member-chip{display:flex;align-items:center;gap:6px;background:var(--bg-ov);border:1px solid var(--br-def);border-radius:var(--r-full);padding:5px 10px 5px 6px;font-size:12px;color:var(--tx-1)}
.member-chip .m-avatar{width:18px;height:18px;border-radius:50%;background:var(--accent);color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700}
.member-chip .m-remove{color:var(--tx-3);cursor:pointer;font-size:10px;padding:2px}
.member-chip .m-remove:hover{color:var(--error)}
.group-add-member{display:flex;gap:8px;margin-top:10px}
.group-add-member select{flex:1;background:var(--bg);border:1px solid var(--br-def);border-radius:var(--r-md);padding:9px 10px;font-family:'DM Sans','Noto Sans TC',sans-serif;font-size:12px;color:var(--tx-2)}
.bulletin-list{margin-top:12px;border-top:1px solid var(--br-sub);padding-top:12px}
.bulletin-row{padding:8px 0;border-bottom:1px solid var(--br-sub)}
.bulletin-row:last-child{border-bottom:none}
.bulletin-body{font-size:13px;color:var(--tx-1);line-height:1.5}
.bulletin-time{font-size:10px;color:var(--tx-3);margin-top:4px}
.bulletin-compose{display:flex;gap:8px;margin-top:10px}
.bulletin-compose textarea{flex:1;background:var(--bg);border:1px solid var(--br-def);border-radius:var(--r-md);padding:10px 12px;font-family:'DM Sans','Noto Sans TC',sans-serif;font-size:13px;color:var(--tx-1);outline:none;resize:none;min-height:44px}
.bulletin-compose textarea:focus{border-color:var(--accent)}
.bulletin-send{background:var(--accent);border:none;border-radius:var(--r-md);padding:0 16px;color:var(--tx-inv);font-family:'DM Sans','Noto Sans TC',sans-serif;font-size:13px;font-weight:600;cursor:pointer;flex-shrink:0}
.bulletin-send:hover{background:var(--accent-h)}
.create-group-btn{width:100%;background:transparent;border:1px dashed var(--accent);border-radius:var(--r-lg);padding:14px;color:var(--accent);font-family:'DM Sans','Noto Sans TC',sans-serif;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:16px}
.create-group-btn:hover{background:var(--accent-dim)}
.group-form{background:var(--bg-el);border:1px solid var(--br-def);border-radius:var(--r-lg);padding:16px;margin-bottom:16px}
.group-form input,.group-form textarea{width:100%;background:var(--bg);border:1px solid var(--br-def);border-radius:var(--r-md);padding:11px 12px;font-family:'DM Sans','Noto Sans TC',sans-serif;font-size:14px;color:var(--tx-1);outline:none;margin-bottom:10px}
.group-form input:focus,.group-form textarea:focus{border-color:var(--accent)}

/* Feedback received */
.feedback-row{background:var(--bg-el);border:1px solid var(--br-def);border-radius:var(--r-lg);padding:14px 16px;margin-bottom:10px}
.feedback-author{font-size:12px;font-weight:600;color:var(--tx-1)}
.feedback-body{font-size:13px;color:var(--tx-2);margin-top:6px;line-height:1.5}
.feedback-time{font-size:10px;color:var(--tx-3);margin-top:6px}
</style>
</head>
<body>

<div class="phone">
  <div class="hdr">
    <button class="back-btn" onclick="window.location.href='profile.html'">←</button>
    <div class="hdr-title">My Students</div>
  </div>

  <div class="tabs">
    <button class="tab-btn on" id="tab-btn-roster" onclick="switchTeacherTab('roster')">Roster</button>
    <button class="tab-btn" id="tab-btn-groups" onclick="switchTeacherTab('groups')">Groups</button>
    <button class="tab-btn" id="tab-btn-feedback" onclick="switchTeacherTab('feedback')">Feedback</button>
  </div>

  <div class="scroll" id="scroll">

    <div class="tab-panel on" id="panel-roster">
      <div class="card">
        <div class="section-label">Shared Categories</div>
        <div id="cat-list"></div>
        <div class="cat-form">
          <input type="text" id="cat-name" placeholder="Category name (e.g. Restorative Flow)" maxlength="40">
          <select id="cat-type">
            <option value="yoga">Yoga</option>
            <option value="movement">Movement</option>
            <option value="breathwork">Breathwork</option>
          </select>
          <button class="cat-add-btn" onclick="addCategory()">Add</button>
        </div>
      </div>

      <div class="card">
        <div class="section-label">Shared Focus Areas</div>
        <div id="focus-list"></div>
        <div class="cat-form">
          <input type="text" id="focus-label" placeholder="Focus name (e.g. Wrists)" maxlength="30">
          <button class="cat-add-btn" onclick="addFocus()">Add</button>
        </div>
        <div class="empty-hint" style="margin-top:4px">Shared focuses appear as "Recommended" badges on your linked students' log screen.</div>
      </div>

      <div class="section-label">Linked Students</div>
      <div id="students-list"></div>
    </div>

    <div class="tab-panel" id="panel-groups">
      <button class="create-group-btn" onclick="toggleGroupForm()">＋ Create Group</button>
      <div class="group-form" id="group-form" style="display:none">
        <input type="text" id="new-group-name" placeholder="Group name (e.g. Private Coaching Circle)" maxlength="80">
        <textarea id="new-group-desc" placeholder="Description (optional)" rows="2"></textarea>
        <button class="cat-add-btn" style="width:100%" onclick="createGroup()">Create</button>
      </div>
      <div id="groups-list"></div>
    </div>

    <div class="tab-panel" id="panel-feedback">
      <div class="section-label">Feedback Received</div>
      <div id="feedback-list"></div>
    </div>

  </div>
</div>

<script>
let currentUser = null
let RED_FLAGS = {} // student_id -> [{ flag_type, detail }]
let LINKED_STUDENTS = [] // [{ student_id, display_name }]
let GROUPS_LOADED = false
let FEEDBACK_LOADED = false

;(async function init() {
  const { data: { session } } = await db.auth.getSession()
  if (!session) { window.location.href = 'login.html'; return }
  currentUser = session.user

  const { data: profile } = await db.from('profiles').select('role').eq('id', currentUser.id).single()
  if (!profile || (profile.role !== 'teacher' && profile.role !== 'studio')) {
    window.location.href = 'index.html'
    return
  }

  await loadRedFlags()
  await Promise.all([loadCategories(), loadFocusAreas(), loadStudents()])
})()

function switchTeacherTab(tab) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('on'))
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('on'))
  document.getElementById('panel-' + tab).classList.add('on')
  document.getElementById('tab-btn-' + tab).classList.add('on')
  if (tab === 'groups' && !GROUPS_LOADED) { GROUPS_LOADED = true; loadGroups() }
  if (tab === 'feedback' && !FEEDBACK_LOADED) { FEEDBACK_LOADED = true; loadFeedbackReceived() }
}

// ── RED FLAG ALERTS ───────────────────────────────────────
async function loadRedFlags() {
  const { data, error } = await db.rpc('compute_red_flags', { p_teacher_id: currentUser.id })
  if (error) { console.error('compute_red_flags failed:', error); return }
  RED_FLAGS = {}
  ;(data || []).forEach(row => {
    if (!RED_FLAGS[row.student_id]) RED_FLAGS[row.student_id] = []
    RED_FLAGS[row.student_id].push({ flag_type: row.flag_type, detail: row.detail })
  })
}

function flagBadgeHtml(studentId) {
  const flags = RED_FLAGS[studentId]
  if (!flags || !flags.length) return ''
  const painFlag = flags.find(f => f.flag_type === 'severe_pain')
  const icon = painFlag ? '🚩' : '💬'
  const cls = painFlag ? 'pain' : ''
  const title = flags.map(f => f.detail).join(' · ')
  return '<span class="flag-badge ' + cls + '" title="' + title.replace(/"/g, '&quot;') + '">' + icon + '</span>'
}

// ── SHARED CATEGORIES ─────────────────────────────────────
async function loadCategories() {
  const { data } = await db.from('practice_categories')
    .select('id, name, category_type, is_active')
    .eq('created_by', currentUser.id)
    .eq('visibility', 'linked')
    .order('created_at', { ascending: false })

  const el = document.getElementById('cat-list')
  el.innerHTML = ''
  if (!data || !data.length) {
    el.innerHTML = '<div class="empty-hint">No shared categories yet. Add one below — it will appear in your linked students\' log form.</div>'
    return
  }
  data.forEach(cat => {
    const row = document.createElement('div')
    row.className = 'cat-row' + (cat.is_active ? '' : ' inactive')
    row.innerHTML =
      '<div><div class="cat-name">' + cat.name + '</div><div class="cat-type">' + cat.category_type + '</div></div>' +
      (cat.is_active ? '<button class="cat-del" onclick="deactivateCategory(\'' + cat.id + '\')">Remove</button>' : '<span class="cat-type" style="margin-left:auto">Removed</span>')
    el.appendChild(row)
  })
}

async function addCategory() {
  const nameInput = document.getElementById('cat-name')
  const name = nameInput.value.trim()
  const type = document.getElementById('cat-type').value
  if (!name) return

  const { error } = await db.from('practice_categories').insert({
    name, category_type: type, icon: '✦', is_system: false,
    created_by: currentUser.id, visibility: 'linked', is_active: true,
  })
  if (error) { console.error('Add category failed:', error); return }
  nameInput.value = ''
  await loadCategories()
}

async function deactivateCategory(id) {
  const { error } = await db.from('practice_categories')
    .update({ is_active: false })
    .eq('id', id)
    .eq('created_by', currentUser.id)
  if (error) { console.error('Deactivate category failed:', error); return }
  await loadCategories()
}

// ── SHARED FOCUS AREAS ────────────────────────────────────
async function loadFocusAreas() {
  const { data } = await db.from('focus_areas')
    .select('id, label, is_active')
    .eq('created_by', currentUser.id)
    .eq('visibility', 'linked')
    .order('created_at', { ascending: false })

  const el = document.getElementById('focus-list')
  el.innerHTML = ''
  if (!data || !data.length) {
    el.innerHTML = '<div class="empty-hint">No shared focuses yet. Add one below — it will appear as Recommended for your linked students.</div>'
    return
  }
  data.forEach(f => {
    const row = document.createElement('div')
    row.className = 'cat-row' + (f.is_active ? '' : ' inactive')
    row.innerHTML =
      '<div><div class="cat-name">' + f.label + '</div></div>' +
      (f.is_active ? '<button class="cat-del" onclick="deactivateFocus(\'' + f.id + '\')">Remove</button>' : '<span class="cat-type" style="margin-left:auto">Removed</span>')
    el.appendChild(row)
  })
}

async function addFocus() {
  const input = document.getElementById('focus-label')
  const label = input.value.trim()
  if (!label) return

  const { error } = await db.from('focus_areas').insert({
    label, created_by: currentUser.id, visibility: 'linked', is_active: true,
  })
  if (error) { console.error('Add focus failed:', error); return }
  input.value = ''
  await loadFocusAreas()
}

async function deactivateFocus(id) {
  const { error } = await db.from('focus_areas')
    .update({ is_active: false })
    .eq('id', id)
    .eq('created_by', currentUser.id)
  if (error) { console.error('Deactivate focus failed:', error); return }
  await loadFocusAreas()
}

// ── LINKED STUDENTS ───────────────────────────────────────
async function loadStudents() {
  const { data: links } = await db.from('studio_linkages')
    .select('student_id, profiles!studio_linkages_student_id_fkey(display_name)')
    .eq('entity_id', currentUser.id)
    .eq('status', 'active')

  const el = document.getElementById('students-list')
  el.innerHTML = ''
  LINKED_STUDENTS = []

  if (!links || !links.length) {
    el.innerHTML = '<div class="empty-hint">No linked students yet. Share your join code from the Profile page.</div>'
    return
  }

  for (const link of links) {
    const name = link.profiles ? link.profiles.display_name : 'Unknown'
    LINKED_STUDENTS.push({ student_id: link.student_id, display_name: name })

    const { data: sessions } = await db.from('practice_logs')
      .select('id, practice_date, style_name, duration_minutes, mood')
      .eq('user_id', link.student_id)
      .eq('is_private', false)
      .order('practice_date', { ascending: false })

    const shared = sessions || []
    const totalMin = shared.reduce((sum, s) => sum + (s.duration_minutes || 0), 0)

    const card = document.createElement('div')
    card.className = 'student-card'
    card.innerHTML =
      '<div class="student-hdr" onclick="toggleStudent(this)">' +
        '<div class="student-avatar">' + (name || 'U').charAt(0).toUpperCase() + '</div>' +
        '<div>' +
          '<div class="student-name">' + name + flagBadgeHtml(link.student_id) + '</div>' +
          '<div class="student-meta">' + shared.length + ' shared session' + (shared.length === 1 ? '' : 's') + ' · ' + totalMin + ' min</div>' +
        '</div>' +
        '<span class="student-chevron">▶</span>' +
      '</div>' +
      '<div class="student-detail">' +
        (shared.length
          ? shared.slice(0, 10).map(s =>
              '<div class="session-row">' +
                '<div><div class="sr-name">' + s.style_name + '</div><div class="sr-date">' + s.practice_date + '</div></div>' +
                '<div class="sr-dur">' + s.duration_minutes + ' min</div>' +
              '</div>'
            ).join('')
          : '<div class="empty-hint">No shared sessions yet — this student\'s practice is currently private.</div>')
      + '</div>'
    el.appendChild(card)
  }
}

function toggleStudent(headerEl) {
  const card = headerEl.closest('.student-card')
  const detail = card.querySelector('.student-detail')
  const chevron = card.querySelector('.student-chevron')
  const show = !detail.classList.contains('show')
  detail.classList.toggle('show', show)
  chevron.classList.toggle('open', show)
}

// ── GROUPS (sub-communities) ──────────────────────────────
function toggleGroupForm() {
  const form = document.getElementById('group-form')
  form.style.display = form.style.display === 'none' ? 'block' : 'none'
}

async function createGroup() {
  const nameInput = document.getElementById('new-group-name')
  const descInput = document.getElementById('new-group-desc')
  const name = nameInput.value.trim()
  if (!name) return

  const { error } = await db.from('groups').insert({
    owner_id: currentUser.id,
    name,
    description: descInput.value.trim() || null,
  })
  if (error) { console.error('Create group failed:', error); return }
  nameInput.value = ''
  descInput.value = ''
  document.getElementById('group-form').style.display = 'none'
  await loadGroups()
}

async function loadGroups() {
  const { data: groups, error } = await db.from('groups')
    .select('id, name, description, created_at')
    .eq('owner_id', currentUser.id)
    .order('created_at', { ascending: false })

  const el = document.getElementById('groups-list')
  el.innerHTML = ''
  if (error) { console.error('Load groups failed:', error); return }

  if (!groups || !groups.length) {
    el.innerHTML = '<div class="empty-hint">No groups yet. Create one to segment your roster into cohorts (e.g. Private Coaching Circle).</div>'
    return
  }

  for (const g of groups) {
    const { data: members } = await db.from('group_members')
      .select('student_id, profiles!group_members_student_id_fkey(display_name)')
      .eq('group_id', g.id)

    const { data: bulletins } = await db.from('group_bulletins')
      .select('id, body, created_at')
      .eq('group_id', g.id)
      .order('created_at', { ascending: false })
      .limit(5)

    const memberList = members || []
    const memberIds = new Set(memberList.map(m => m.student_id))
    const availableStudents = LINKED_STUDENTS.filter(s => !memberIds.has(s.student_id))

    const card = document.createElement('div')
    card.className = 'group-card'
    card.id = 'group-card-' + g.id
    card.innerHTML =
      '<div class="group-name">' + g.name + '</div>' +
      (g.description ? '<div class="group-desc">' + g.description + '</div>' : '') +
      '<div class="group-meta">' + memberList.length + ' member' + (memberList.length === 1 ? '' : 's') + '</div>' +
      '<div class="group-members">' +
        memberList.map(m => {
          const mname = m.profiles ? m.profiles.display_name : 'Unknown'
          return '<span class="member-chip"><span class="m-avatar">' + (mname || 'U').charAt(0).toUpperCase() + '</span>' + mname +
            '<span class="m-remove" onclick="removeMember(\'' + g.id + '\',\'' + m.student_id + '\')">✕</span></span>'
        }).join('') +
      '</div>' +
      (availableStudents.length
        ? '<div class="group-add-member">' +
            '<select id="add-member-' + g.id + '">' +
              availableStudents.map(s => '<option value="' + s.student_id + '">' + s.display_name + '</option>').join('') +
            '</select>' +
            '<button class="cat-add-btn" onclick="addMember(\'' + g.id + '\')">Add</button>' +
          '</div>'
        : '') +
      '<div class="bulletin-list">' +
        (bulletins && bulletins.length
          ? bulletins.map(b =>
              '<div class="bulletin-row"><div class="bulletin-body">' + b.body + '</div><div class="bulletin-time">' + new Date(b.created_at).toLocaleString() + '</div></div>'
            ).join('')
          : '<div class="empty-hint">No bulletins sent yet.</div>') +
        '<div class="bulletin-compose">' +
          '<textarea id="bulletin-input-' + g.id + '" placeholder="Write a bulletin…" maxlength="2000"></textarea>' +
          '<button class="bulletin-send" onclick="sendBulletin(\'' + g.id + '\')">Send</button>' +
        '</div>' +
      '</div>'
    el.appendChild(card)
  }
}

async function addMember(groupId) {
  const select = document.getElementById('add-member-' + groupId)
  const studentId = select.value
  if (!studentId) return

  const { error } = await db.from('group_members').insert({
    group_id: groupId,
    student_id: studentId,
    added_by: currentUser.id,
  })
  if (error) { console.error('Add member failed:', error); return }
  await loadGroups()
}

async function removeMember(groupId, studentId) {
  const { error } = await db.from('group_members')
    .delete()
    .eq('group_id', groupId)
    .eq('student_id', studentId)
  if (error) { console.error('Remove member failed:', error); return }
  await loadGroups()
}

async function sendBulletin(groupId) {
  const input = document.getElementById('bulletin-input-' + groupId)
  const body = input.value.trim()
  if (!body) return

  const { error } = await db.from('group_bulletins').insert({
    group_id: groupId,
    author_id: currentUser.id,
    body,
  })
  if (error) { console.error('Send bulletin failed:', error); return }
  input.value = ''
  await loadGroups()
}

// ── FEEDBACK RECEIVED ─────────────────────────────────────
async function loadFeedbackReceived() {
  const { data, error } = await db.from('feedback')
    .select('id, body, created_at, author_id, profiles!feedback_author_id_fkey(display_name)')
    .eq('target_entity_id', currentUser.id)
    .eq('direction', 'student_to_teacher')
    .order('created_at', { ascending: false })

  const el = document.getElementById('feedback-list')
  el.innerHTML = ''
  if (error) { console.error('Load feedback failed:', error); return }

  if (!data || !data.length) {
    el.innerHTML = '<div class="empty-hint">No feedback received yet.</div>'
    return
  }

  data.forEach(f => {
    const authorName = f.profiles ? f.profiles.display_name : 'A student'
    const row = document.createElement('div')
    row.className = 'feedback-row'
    row.innerHTML =
      '<div class="feedback-author">' + authorName + '</div>' +
      '<div class="feedback-body">' + f.body + '</div>' +
      '<div class="feedback-time">' + new Date(f.created_at).toLocaleString() + '</div>'
    el.appendChild(row)
  })
}
</script>
