<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>

<title>Lumen — Video Studio</title>

  const SUPABASE_KEY = 'sb_publishable_Xkhwx_hNFyRGNp0Njqne3g_qD9VdFHy'

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg:#080807; --bg-el:#111110; --bg-ov:#1A1917;
  --br-sub:#1E1E1C; --br-def:#2A2A27;
  --tx-1:#E8E0D0; --tx-2:#9A9080; --tx-3:#5A5448;
  --accent:#C8A96E; --accent-h:#D8BA80; --adim:rgba(200,169,110,0.12);
  --success:#7B9E87; --warning:#D4956A; --error:#C47070;
  --r-sm:8px; --r-md:10px; --r-lg:14px; --r-xl:20px;
}
html,body { background:var(--bg); font-family:'DM Sans','Noto Sans TC',sans-serif; color:var(--tx-1); min-height:100%; }
#app { max-width:560px; margin:0 auto; min-height:100dvh; padding-bottom:60px; }
.header { display:flex; align-items:center; gap:14px; padding:18px 20px 14px; border-bottom:1px solid var(--br-sub); position:sticky; top:0; background:var(--bg); z-index:10; }
.back-btn { background:none; border:none; color:var(--tx-2); font-size:20px; cursor:pointer; padding:4px; line-height:1; }
.back-btn:hover { color:var(--tx-1); }
.header-title { font-family:'Cormorant Garamond','Noto Serif TC',serif; font-size:22px; font-weight:300; flex:1; }

.section { padding:20px; }
.card { background:var(--bg-el); border:1px solid var(--br-sub); border-radius:var(--r-xl); padding:20px; margin-bottom:18px; }
.card-title { font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--accent); margin-bottom:16px; }

label.field-lbl { display:block; font-size:13px; color:var(--tx-2); margin:14px 0 6px; }
input[type=text], textarea {
  width:100%; background:var(--bg-ov); border:1px solid var(--br-def); border-radius:var(--r-md);
  color:var(--tx-1); font-family:inherit; font-size:14px; padding:11px 12px; resize:vertical;
}
input[type=text]:focus, textarea:focus { outline:none; border-color:var(--accent); }
textarea { min-height:74px; }

.drop-zone { position:relative; border:1px dashed var(--br-def); border-radius:var(--r-lg); padding:26px 18px; text-align:center; cursor:pointer; background:var(--bg-ov); transition:all .2s; }
.drop-zone:hover { border-color:var(--accent); background:var(--adim); }
.drop-zone input[type=file] { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.dz-icon { font-size:28px; margin-bottom:8px; }
.dz-main { font-size:14px; color:var(--tx-1); font-weight:500; }
.dz-sub  { font-size:12px; color:var(--tx-3); margin-top:4px; }
.file-name { font-size:13px; color:var(--accent); margin-top:10px; word-break:break-all; }

.row-toggle { display:flex; align-items:center; justify-content:space-between; margin-top:16px; }
.row-toggle .rt-lbl { font-size:14px; color:var(--tx-1); }
.row-toggle .rt-sub { font-size:12px; color:var(--tx-3); margin-top:2px; }
.switch { position:relative; width:46px; height:26px; flex-shrink:0; }
.switch input { opacity:0; width:0; height:0; }
.slider { position:absolute; inset:0; background:var(--br-def); border-radius:26px; transition:.2s; cursor:pointer; }
.slider::before { content:''; position:absolute; height:20px; width:20px; left:3px; top:3px; background:var(--tx-2); border-radius:50%; transition:.2s; }
.switch input:checked + .slider { background:var(--adim); }
.switch input:checked + .slider::before { transform:translateX(20px); background:var(--accent); }

.btn { width:100%; margin-top:20px; padding:13px; border:none; border-radius:var(--r-lg); background:var(--accent); color:#1a1a17; font-family:inherit; font-size:15px; font-weight:600; cursor:pointer; transition:background .2s; }
.btn:hover:not(:disabled) { background:var(--accent-h); }
.btn:disabled { opacity:.5; cursor:not-allowed; }
.btn.ghost { background:var(--bg-ov); color:var(--tx-1); border:1px solid var(--br-def); }

.progress-wrap { margin-top:18px; }
.progress-track { height:6px; background:var(--br-def); border-radius:4px; overflow:hidden; }
.progress-fill { height:100%; width:0%; background:var(--accent); border-radius:4px; transition:width .3s; }
.progress-status { font-size:12px; color:var(--tx-2); margin-top:8px; display:flex; align-items:center; gap:8px; }
.spinner { width:14px; height:14px; border:2px solid var(--br-def); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }

.banner { border-radius:var(--r-md); padding:12px 14px; font-size:13px; line-height:1.5; margin-bottom:16px; }
.banner.warn  { background:rgba(212,149,106,.1); border:1px solid rgba(212,149,106,.3); color:var(--warning); }
.banner.err   { background:rgba(196,112,112,.1); border:1px solid rgba(196,112,112,.3); color:var(--error); }
.banner.ok    { background:rgba(123,158,135,.1); border:1px solid rgba(123,158,135,.3); color:var(--success); }

.vid-row { display:flex; align-items:center; gap:12px; padding:14px 0; border-bottom:1px solid var(--br-sub); }
.vid-row:last-child { border-bottom:none; }
.vid-thumb { width:52px; height:52px; border-radius:var(--r-md); background:var(--bg-ov); border:1px solid var(--br-def); display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0; }
.vid-info { flex:1; min-width:0; }
.vid-title { font-size:14px; font-weight:500; color:var(--tx-1); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.vid-meta  { font-size:12px; color:var(--tx-3); margin-top:2px; }
.vid-badge { display:inline-block; font-size:10px; letter-spacing:.08em; text-transform:uppercase; padding:2px 8px; border-radius:20px; margin-left:8px; }
.vid-badge.pub   { background:rgba(123,158,135,.15); color:var(--success); }
.vid-badge.draft { background:var(--bg-ov); color:var(--tx-3); border:1px solid var(--br-def); }
.vid-actions { display:flex; gap:8px; flex-shrink:0; }
.vid-btn { font-size:12px; padding:6px 10px; border-radius:var(--r-sm); border:1px solid var(--br-def); background:var(--bg-ov); color:var(--tx-2); cursor:pointer; }
.vid-btn:hover { color:var(--tx-1); }
.vid-btn.danger:hover { color:var(--error); border-color:var(--error); }
.empty { text-align:center; color:var(--tx-3); font-size:13px; padding:24px 0; }

.loading-full { position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; z-index:100; }
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <button class="back-btn" onclick="window.location.href='index.html'">←</button>
    <span class="header-title">Video Studio</span>
  </div>

  <div class="section">
    <!-- Config warning shown if the Mux serverless functions aren't set up -->
    <div id="config-banner"></div>

    <!-- Upload form -->
    <div class="card" id="upload-card">
      <div class="card-title">Upload a Class</div>

      <div class="drop-zone" id="drop-zone">
        <div class="dz-icon">🎬</div>
        <div class="dz-main">Choose a video file</div>
        <div class="dz-sub">MP4, MOV or WebM · up to ~1GB</div>
        <input type="file" id="file-input" accept="video/*"/>
      </div>
      <div class="file-name" id="file-name"></div>

      <label class="field-lbl" for="v-title">Title</label>
      <input type="text" id="v-title" placeholder="e.g. Morning Vinyasa Flow" maxlength="120"/>

      <label class="field-lbl" for="v-desc">Description</label>
      <textarea id="v-desc" placeholder="What is this class about?" maxlength="600"></textarea>

      <div class="row-toggle">
        <div>
          <div class="rt-lbl">Publish immediately</div>
          <div class="rt-sub">Off = saved as a private draft</div>
        </div>
        <label class="switch">
          <input type="checkbox" id="v-publish"/>
          <span class="slider"></span>
        </label>
      </div>

      <button class="btn" id="upload-btn" onclick="startUpload()">Upload &amp; Save</button>

      <div class="progress-wrap" id="progress-wrap" style="display:none">
        <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
        <div class="progress-status" id="progress-status"></div>
      </div>
      <div id="upload-result"></div>
    </div>

    <!-- Existing videos -->
    <div class="card">
      <div class="card-title">Your Videos</div>
      <div id="video-list"><div class="empty">Loading…</div></div>
    </div>
  </div>
</div>

<div class="loading-full" id="loading-full"><div class="spinner" style="width:28px;height:28px"></div></div>

<script type="module">
let currentUser = null;
let currentRole = null;
let selectedFile = null;

const $ = (id) => document.getElementById(id);

// ── Auth guard: teacher/studio only ──────────────────────────
async function init() {
  const { data: { session } } = await db.auth.getSession();
  if (!session) { window.location.href = 'login.html'; return; }
  currentUser = session.user;

  const { data: prof } = await db.from('profiles')
    .select('role').eq('id', currentUser.id).maybeSingle();
  currentRole = prof ? prof.role : null;

  if (currentRole !== 'teacher' && currentRole !== 'studio') {
    document.querySelector('.section').innerHTML =
      '<div class="banner warn">The Video Studio is available to teacher and studio accounts only.</div>';
    $('loading-full').style.display = 'none';
    return;
  }

  await probeConfig();
  await loadVideos();
  $('loading-full').style.display = 'none';
}

// Show a hint if the Mux functions aren't deployed/configured yet.
async function probeConfig() {
  try {
    const res = await fetch('/api/mux-create-upload', { method: 'GET' });
    // GET is 405 when the function exists; a 404 means it isn't deployed.
    if (res.status === 404) {
      $('config-banner').innerHTML =
        '<div class="banner warn">Video uploading needs the Mux serverless functions deployed on Vercel with <b>MUX_TOKEN_ID</b> and <b>MUX_TOKEN_SECRET</b> set. Until then, uploads will fail.</div>';
    }
  } catch { /* ignore probe errors */ }
}

// ── File pick ────────────────────────────────────────────────
$('file-input').addEventListener('change', (e) => {
  selectedFile = e.target.files[0] || null;
  $('file-name').textContent = selectedFile ? selectedFile.name : '';
  if (selectedFile && !$('v-title').value) {
    // Prefill title from filename (strip extension)
    $('v-title').value = selectedFile.name.replace(/\.[^.]+$/, '').slice(0, 120);
  }
});

// ── Upload pipeline ──────────────────────────────────────────
async function startUpload() {
  const title = $('v-title').value.trim();
  if (!selectedFile) { showResult('err', 'Pick a video file first.'); return; }
  if (!title)        { showResult('err', 'Give the class a title.');  return; }

  setBusy(true);
  setProgress(0, 'Preparing upload…');

  const { data: { session } } = await db.auth.getSession();
  const accessToken = session?.access_token;

  // 1. Ask our serverless function for a Mux direct-upload URL.
  let uploadUrl, uploadId;
  try {
    const res = await fetch('/api/mux-create-upload', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        Authorization: 'Bearer ' + accessToken,
      },
      body: JSON.stringify({}),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Could not create upload');
    uploadUrl = data.url;
    uploadId  = data.uploadId;
  } catch (e) {
    setBusy(false); showResult('err', 'Upload setup failed: ' + e.message); return;
  }

  // 2. PUT the file bytes straight to Mux (with progress).
  try {
    await putWithProgress(uploadUrl, selectedFile, (pct) => {
      setProgress(Math.round(pct * 0.7), 'Uploading… ' + Math.round(pct) + '%');
    });
  } catch (e) {
    setBusy(false); showResult('err', 'File upload failed: ' + e.message); return;
  }

  // 3. Poll our status function until Mux finishes processing.
  setProgress(72, 'Processing video on Mux…');
  let ready;
  try {
    ready = await pollStatus(uploadId, accessToken);
  } catch (e) {
    setBusy(false); showResult('err', 'Processing failed: ' + e.message); return;
  }
  if (!ready.playbackId) {
    setBusy(false); showResult('err', 'Mux did not return a playback ID.'); return;
  }

  // 4. Insert the catalog row.
  setProgress(92, 'Saving to your catalog…');
  const isStudio = currentRole === 'studio';
  const row = {
    title,
    description:      $('v-desc').value.trim() || null,
    mux_playback_id: ready.playbackId,
    duration_seconds: ready.duration || null,
    teacher_id:      isStudio ? null : currentUser.id,
    studio_id:       isStudio ? currentUser.id : null,
    is_published:    $('v-publish').checked,
  };
  const { error } = await db.from('videos').insert(row);
  if (error) {
    setBusy(false); showResult('err', 'Saved on Mux but catalog insert failed: ' + error.message); return;
  }

  setProgress(100, 'Done');
  setBusy(false);
  showResult('ok', 'Video saved' + (row.is_published ? ' and published.' : ' as a draft.'));
  resetForm();
  await loadVideos();
}

// PUT a File to a URL with upload progress via XHR.
function putWithProgress(url, file, onProgress) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('PUT', url, true);
    xhr.upload.onprogress = (e) => {
      if (e.lengthComputable) onProgress((e.loaded / e.total) * 100);
    };
    xhr.onload = () =>
      (xhr.status >= 200 && xhr.status < 300)
        ? resolve()
        : reject(new Error('HTTP ' + xhr.status));
    xhr.onerror = () => reject(new Error('network error'));
    xhr.send(file);
  });
}

// Poll the status endpoint; resolve when 'ready', reject on 'errored'/timeout.
async function pollStatus(uploadId, accessToken, maxTries = 60) {
  for (let i = 0; i < maxTries; i++) {
    const res = await fetch('/api/mux-upload-status?uploadId=' + encodeURIComponent(uploadId), {
      headers: { Authorization: 'Bearer ' + accessToken },
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'status check failed');
    if (data.state === 'ready')   return data;
    if (data.state === 'errored') throw new Error('Mux reported an error');
    // waiting/preparing → keep polling
    const pct = 72 + Math.min(i, 18);
    setProgress(pct, data.state === 'waiting' ? 'Finishing upload…' : 'Processing video on Mux…');
    await new Promise((r) => setTimeout(r, 3000));
  }
  throw new Error('timed out waiting for Mux');
}

// ── Existing videos list ─────────────────────────────────────
async function loadVideos() {
  const mine = currentRole === 'studio'
    ? db.from('videos').select('*').eq('studio_id', currentUser.id)
    : db.from('videos').select('*').eq('teacher_id', currentUser.id);
  const { data, error } = await mine.order('created_at', { ascending: false });

  const list = $('video-list');
  if (error) { list.innerHTML = '<div class="empty">Could not load videos.</div>'; return; }
  if (!data || !data.length) { list.innerHTML = '<div class="empty">No videos yet. Upload your first class above.</div>'; return; }

  list.innerHTML = '';
  data.forEach((v) => {
    const mins = v.duration_seconds ? Math.round(v.duration_seconds / 60) + ' min' : '—';
    const badge = v.is_published
      ? '<span class="vid-badge pub">Published</span>'
      : '<span class="vid-badge draft">Draft</span>';
    const row = document.createElement('div');
    row.className = 'vid-row';
    row.innerHTML =
      '<div class="vid-thumb">🎥</div>' +
      '<div class="vid-info">' +
        '<div class="vid-title">' + escapeHtml(v.title) + badge + '</div>' +
        '<div class="vid-meta">' + mins + '</div>' +
      '</div>' +
      '<div class="vid-actions">' +
        '<button class="vid-btn" data-act="toggle" data-id="' + v.id + '" data-pub="' + v.is_published + '">' +
          (v.is_published ? 'Unpublish' : 'Publish') + '</button>' +
        '<button class="vid-btn danger" data-act="del" data-id="' + v.id + '">Delete</button>' +
      '</div>';
    list.appendChild(row);
  });

  list.querySelectorAll('.vid-btn').forEach((b) => {
    b.addEventListener('click', () => {
      const id = b.dataset.id;
      if (b.dataset.act === 'toggle') togglePublish(id, b.dataset.pub === 'true');
      else deleteVideo(id);
    });
  });
}

async function togglePublish(id, currentlyPub) {
  const { error } = await db.from('videos')
    .update({ is_published: !currentlyPub, updated_at: new Date().toISOString() })
    .eq('id', id);
  if (error) { showResult('err', 'Could not update: ' + error.message); return; }
  await loadVideos();
}

async function deleteVideo(id) {
  if (!confirm('Delete this video from your catalog? Viewers will lose access.')) return;
  const { error } = await db.from('videos').delete().eq('id', id);
  if (error) { showResult('err', 'Delete failed: ' + error.message); return; }
  await loadVideos();
}

// ── UI helpers ───────────────────────────────────────────────
function setBusy(busy) {
  $('upload-btn').disabled = busy;
  $('progress-wrap').style.display = busy ? 'block' : ($('progress-fill').style.width === '100%' ? 'block' : 'none');
}
function setProgress(pct, label) {
  $('progress-wrap').style.display = 'block';
  $('progress-fill').style.width = pct + '%';
  $('progress-status').innerHTML =
    (pct < 100 ? '<span class="spinner"></span>' : '✓ ') + '<span>' + label + '</span>';
}
function showResult(kind, msg) {
  $('upload-result').innerHTML = '<div class="banner ' + kind + '" style="margin-top:16px">' + msg + '</div>';
}
function resetForm() {
  selectedFile = null;
  $('file-input').value = '';
  $('file-name').textContent = '';
  $('v-title').value = '';
  $('v-desc').value = '';
  $('v-publish').checked = false;
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) =>
    ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

// Expose handlers used by inline onclick
window.startUpload = startUpload;

init();
</script>
</body>
</html>
