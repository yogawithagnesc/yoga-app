<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<title>Lumen — Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://vuodmnhebsjmwdeazdtc.supabase.co'
  const SUPABASE_KEY = 'sb_publishable_Xkhwx_hNFyRGNp0Njqne3g_qD9VdFHy'
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)
</script>

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --bg:      #080807;
  --bg-el:   #111110;
  --bg-ov:   #1A1917;
  --br-sub:  #1E1E1C;
  --br-def:  #2A2A27;
  --tx-1:    #E8E0D0;
  --tx-2:    #9A9080;
  --tx-3:    #5A5448;
  --accent:  #C8A96E;
  --adim:    rgba(200,169,110,0.12);
  --success: #7B9E87;
  --error:   #C47070;
  --r-md:    10px;
  --r-lg:    14px;
  --r-xl:    20px;
}

html, body {
  height: 100%;
  background: var(--bg);
  font-family: 'DM Sans', 'Noto Sans TC', sans-serif;
  color: var(--tx-1);
  overflow: hidden;
}

#app {
  max-width: 430px;
  margin: 0 auto;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
}

/* Ambient glow */
.glow {
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  pointer-events: none;
  z-index: 0;
}
.glow-1 {
  width: 300px; height: 300px;
  background: rgba(200,169,110,0.07);
  top: -80px; right: -80px;
}
.glow-2 {
  width: 200px; height: 200px;
  background: rgba(123,158,135,0.05);
  bottom: 80px; left: -60px;
}

/* Scroll */
.scroll {
  flex: 1;
  overflow-y: auto;
  scrollbar-width: none;
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 40px 28px 60px;
}
.scroll::-webkit-scrollbar { display: none; }

/* Logo */
.logo-wrap {
  text-align: center;
  margin-bottom: 48px;
}
.logo-word {
  font-family: 'Tenor Sans', 'Noto Sans TC', sans-serif;
  font-size: 36px;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--tx-1);
  padding-right: 0.28em;
  display: block;
  line-height: 1;
}
.logo-rule {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 10px;
}
.rule-line { flex: 1; height: 1px; background: var(--accent); }
.rule-text {
  font-family: 'DM Sans', 'Noto Sans TC', sans-serif;
  font-weight: 300;
  font-size: 8px;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: var(--accent);
  white-space: nowrap;
}

/* Card */
.card {
  background: var(--bg-el);
  border: 1px solid var(--br-sub);
  border-radius: var(--r-xl);
  padding: 28px 24px;
}
.card-title {
  font-family: 'Cormorant Garamond', 'Noto Serif TC', serif;
  font-size: 26px;
  font-weight: 300;
  color: var(--tx-1);
  margin-bottom: 6px;
}
.card-sub {
  font-size: 13px;
  color: var(--tx-3);
  margin-bottom: 24px;
  line-height: 1.5;
}

/* Form */
.field { margin-bottom: 16px; }
.field-label {
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--tx-3);
  margin-bottom: 7px;
  display: block;
}
.field-input {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--br-def);
  border-radius: var(--r-md);
  padding: 13px 16px;
  font-family: 'DM Sans', 'Noto Sans TC', sans-serif;
  font-size: 15px;
  color: var(--tx-1);
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
  -webkit-appearance: none;
}
.field-input::placeholder { color: var(--tx-3); font-size: 14px; }
.field-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--adim);
}
.field-input.err { border-color: var(--error); }

/* Password toggle */
.pw-wrap { position: relative; }
.pw-toggle {
  position: absolute; right: 14px; top: 50%;
  transform: translateY(-50%);
  background: none; border: none; cursor: pointer;
  color: var(--tx-3); font-size: 16px; padding: 14px;
  transition: color 0.15s;
}
.pw-toggle:hover { color: var(--tx-1); }

/* Error message */
.err-msg {
  font-size: 12px;
  color: var(--error);
  margin-top: 5px;
  display: none;
  line-height: 1.5;
}
.err-msg.show { display: block; }

/* Alert box */
.alert-box {
  background: rgba(196,112,112,0.1);
  border: 1px solid rgba(196,112,112,0.3);
  border-radius: var(--r-md);
  padding: 12px 14px;
  font-size: 13px;
  color: var(--error);
  margin-bottom: 16px;
  display: none;
  line-height: 1.6;
}
.alert-box.show { display: block; }

/* Primary button */
.btn-primary {
  width: 100%;
  background: var(--accent);
  color: var(--bg);
  border: none;
  border-radius: var(--r-lg);
  padding: 15px;
  font-family: 'DM Sans', 'Noto Sans TC', sans-serif;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  letter-spacing: 0.04em;
  transition: all 0.18s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-top: 8px;
}
.btn-primary:hover { background: #D8BA80; }
.btn-primary:active { background: #A88848; transform: scale(0.99); }
.btn-primary:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

/* Spinner */
.spinner {
  width: 16px; height: 16px;
  border: 2px solid rgba(0,0,0,0.2);
  border-top-color: var(--bg);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Divider */
.divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 20px 0;
}
.divider-line { flex: 1; height: 1px; background: var(--br-sub); }
.divider-text { font-size: 11px; color: var(--tx-3); letter-spacing: 0.05em; }

/* OAuth */
.oauth-row { display: flex; gap: 10px; }
.btn-oauth {
  flex: 1; min-height: 44px; display: flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--bg-el); border: 1px solid var(--br-def); border-radius: var(--r-lg);
  color: var(--tx-1); font-family: 'DM Sans', 'Noto Sans TC', sans-serif; font-size: 13px; font-weight: 500;
  cursor: pointer; transition: all 0.18s;
}
.btn-oauth:hover { border-color: var(--accent); background: var(--bg-ov); }
.btn-oauth svg { width: 16px; height: 16px; flex-shrink: 0; }

/* Register link */
.switch-link {
  text-align: center;
  margin-top: 20px;
  font-size: 13px;
  color: var(--tx-3);
}
.switch-link a {
  color: var(--accent);
  text-decoration: none;
  font-weight: 500;
}
.switch-link a:hover { text-decoration: underline; }

/* Forgot password */
.forgot-link {
  text-align: right;
  margin-top: -8px;
  margin-bottom: 16px;
}
.forgot-link a {
  font-size: 12px;
  color: var(--tx-3);
  text-decoration: none;
  transition: color 0.15s;
}
.forgot-link a:hover { color: var(--accent); }
</style>
</head>
<body>
<div id="app">
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>

  <div class="scroll">

    <!-- Logo -->
    <div class="logo-wrap">
      <span class="logo-word">LUMEN</span>
      <div class="logo-rule">
        <div class="rule-line"></div>
        <span class="rule-text">ILLUMINATE YOUR PRACTICE</span>
        <div class="rule-line"></div>
      </div>
    </div>

    <!-- Login Card -->
    <div class="card">
      <div class="card-title">Welcome back</div>
      <div class="card-sub">Login to continue your practice journey</div>

      <!-- Error alert -->
      <div class="alert-box" id="alert-box"></div>

      <!-- Email -->
      <div class="field">
        <label class="field-label" for="email">Email</label>
        <input
          class="field-input"
          type="email"
          id="email"
          placeholder="your@email.com"
          autocomplete="email"
          inputmode="email"
        />
        <div class="err-msg" id="email-err">Please enter a valid email address</div>
      </div>

      <!-- Password -->
      <div class="field">
        <label class="field-label" for="password">Password</label>
        <div class="pw-wrap">
          <input
            class="field-input"
            type="password"
            id="password"
            placeholder="Your password"
            autocomplete="current-password"
          />
          <button class="pw-toggle" type="button" onclick="togglePw('password', this)" aria-label="Show password">
            👁
          </button>
        </div>
        <div class="err-msg" id="pw-err">Password cannot be empty</div>
      </div>

      <!-- Forgot -->
      <div class="forgot-link">
        <a href="#" onclick="forgotPassword(); return false;">Forgot password?</a>
      </div>

      <!-- Login button -->
      <button class="btn-primary" id="login-btn" onclick="handleLogin()">
        Login
      </button>

      <div class="divider">
        <div class="divider-line"></div>
        <span class="divider-text">or continue with</span>
        <div class="divider-line"></div>
      </div>

      <div class="oauth-row">
        <button class="btn-oauth" onclick="signInWithProvider('google')">
          <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M23.49 12.27c0-.79-.07-1.54-.19-2.27H12v4.51h6.47c-.29 1.48-1.14 2.73-2.4 3.58v3h3.86c2.26-2.09 3.56-5.17 3.56-8.82z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.86-3c-1.08.72-2.45 1.16-4.07 1.16-3.13 0-5.78-2.11-6.73-4.96H1.29v3.09C3.26 21.3 7.31 24 12 24z"/><path fill="#FBBC05" d="M5.27 14.29c-.25-.72-.38-1.49-.38-2.29s.14-1.57.38-2.29V6.62H1.29A11.95 11.95 0 000 12c0 1.92.46 3.74 1.29 5.38l3.98-3.09z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.94 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.62l3.98 3.09C6.22 6.86 8.87 4.75 12 4.75z"/></svg>
          Google
        </button>
        <button class="btn-oauth" onclick="signInWithProvider('apple')">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.365 1.43c0 1.14-.462 2.15-1.217 2.9-.845.86-2.007 1.51-3.076 1.42-.14-1.1.446-2.24 1.18-2.96C13.99.65 15.24.02 16.24 0c.03.13.06.28.06.43zM20.4 17.06c-.5 1.15-.73 1.66-1.36 2.68-.88 1.42-2.12 3.19-3.66 3.2-1.37.02-1.72-.9-3.58-.89-1.85.01-2.24.9-3.6.88-1.54-.02-2.72-1.62-3.6-3.04-2.47-3.98-2.72-8.65-1.2-11.14 1.08-1.77 2.79-2.81 4.4-2.81 1.63 0 2.66.9 4 .9 1.3 0 2.1-.9 3.98-.9 1.44 0 2.96.79 4.05 2.14-3.56 1.95-2.98 6.99-.44 8.98z"/></svg>
          Apple
        </button>
      </div>

      <div class="divider">
        <div class="divider-line"></div>
        <span class="divider-text">Don't have an account?</span>
        <div class="divider-line"></div>
      </div>

      <div class="switch-link">
        <a href="register.html">Create account →</a>
      </div>
    </div>

  </div>
</div>

<script>
// ── Check if already logged in ──────────────────────────
(async () => {
  const { data: { session } } = await db.auth.getSession()
  if (session) {
    window.location.href = 'index.html'
  }
})()

// ── Toggle password visibility ──────────────────────────
function togglePw(id, btn) {
  const input = document.getElementById(id)
  if (input.type === 'password') {
    input.type = 'text'
    btn.textContent = '🙈'
  } else {
    input.type = 'password'
    btn.textContent = '👁'
  }
}

// ── Handle login ────────────────────────────────────────
async function handleLogin() {
  const email    = document.getElementById('email').value.trim()
  const password = document.getElementById('password').value
  const btn      = document.getElementById('login-btn')
  const alert    = document.getElementById('alert-box')

  // Clear previous errors
  alert.classList.remove('show')
  document.getElementById('email-err').classList.remove('show')
  document.getElementById('pw-err').classList.remove('show')
  document.getElementById('email').classList.remove('err')
  document.getElementById('password').classList.remove('err')

  // Validate
  let hasError = false
  if (!email || !email.includes('@')) {
    document.getElementById('email-err').classList.add('show')
    document.getElementById('email').classList.add('err')
    hasError = true
  }
  if (!password) {
    document.getElementById('pw-err').classList.add('show')
    document.getElementById('password').classList.add('err')
    hasError = true
  }
  if (hasError) return

  // Loading state
  btn.disabled = true
  btn.innerHTML = '<div class="spinner"></div> Logging in…'

  try {
    const { data, error } = await db.auth.signInWithPassword({ email, password })

    if (error) {
      let msg = 'Login failed. Please check your email and password.'
      if (error.message.includes('Invalid login')) msg = 'Incorrect email or password. Please try again.'
      if (error.message.includes('Email not confirmed')) msg = 'Please verify your email first. Check your inbox.'
      alert.textContent = msg
      alert.classList.add('show')
      btn.disabled = false
      btn.innerHTML = 'Login'
      return
    }

    // Check whether this user has completed role selection
    const { data: profile } = await db
      .from('profiles')
      .select('role')
      .eq('id', data.user.id)
      .single()

    btn.innerHTML = '✓ Welcome back!'
    btn.style.background = '#7B9E87'
    const dest = profile?.role ? 'index.html' : 'role-select.html'
    setTimeout(() => { window.location.href = dest }, 600)

  } catch (e) {
    alert.textContent = 'Network error. Please check your connection.'
    alert.classList.add('show')
    btn.disabled = false
    btn.innerHTML = 'Login'
  }
}

// ── Enter key ───────────────────────────────────────────
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') handleLogin()
})

// ── OAuth sign-in ────────────────────────────────────────
async function signInWithProvider(provider) {
  const { error } = await db.auth.signInWithOAuth({
    provider,
    options: { redirectTo: window.location.origin + '/index.html' }
  })
  if (error) {
    const alert = document.getElementById('alert-box')
    alert.textContent = 'Could not start ' + provider + ' sign-in. Please try again.'
    alert.classList.add('show')
  }
}

// ── Forgot password ─────────────────────────────────────
async function forgotPassword() {
  const email = document.getElementById('email').value.trim()
  if (!email || !email.includes('@')) {
    document.getElementById('email').focus()
    document.getElementById('email-err').textContent = 'Enter your email above first'
    document.getElementById('email-err').classList.add('show')
    return
  }

  const { error } = await db.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin + '/reset-password.html'
  })

  const alert = document.getElementById('alert-box')
  if (!error) {
    alert.style.background = 'rgba(123,158,135,0.1)'
    alert.style.borderColor = 'rgba(123,158,135,0.3)'
    alert.style.color = '#7B9E87'
    alert.textContent = '✓ Password reset email sent. Check your inbox.'
    alert.classList.add('show')
  } else {
    alert.textContent = 'Could not send reset email. Please try again.'
    alert.classList.add('show')
  }
}
</script>
</body>
</html>
